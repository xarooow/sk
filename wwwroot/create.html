<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Создать событие</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 500px;
            margin: auto;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }

        button {
            padding: 10px 15px;
            background-color: #28a745;
            color: white;
            border: none;
            cursor: pointer;
        }

            button:hover {
                background-color: #218838;
            }

        .nav {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="nav">
        <a href="index.html">⬅ Назад к списку событий</a>
    </div>

    <h2>Добавить новое событие</h2>
    <form id="createEventForm">
        <div class="form-group">
            <label>Название события:</label>
            <input type="text" id="name" required>
        </div>
        <div class="form-group">
            <label>Описание:</label>
            <input type="text" id="description" required>
        </div>
        <div class="form-group">
            <label>Долгота (Longitude):</label>
            <input type="number" step="any" id="longitude" required placeholder="Например: 37.6173">
        </div>
        <div class="form-group">
            <label>Широта (Latitude):</label>
            <input type="number" step="any" id="latitude" required placeholder="Например: 55.7558">
        </div>
        <button type="submit">Создать событие</button>
    </form>

    <script>document.getElementById('createEventForm').addEventListener('submit', async (e) => {
            e.preventDefault(); // Останавливаем стандартную перезагрузку страницы

            // Собираем данные в формате CreateEventModel
            const newEvent = {
                NameOfEvent: document.getElementById('name').value,
                Description: document.getElementById('description').value,
                Longitude: parseFloat(document.getElementById('longitude').value),
                Latitude: parseFloat(document.getElementById('latitude').value)
            };

            try {
                const response = await fetch('/api/events', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newEvent)
                });

                if (response.ok) {
                    alert('Событие успешно создано!');
                    window.location.href = 'index.html'; // Перенаправляем на страницу списка
                } else {
                    alert('Ошибка при создании события.');
                }
            } catch (error) {
                console.error('Ошибка:', error);
                alert('Не удалось подключиться к серверу.');
            }
        });</script>
</body>
</html>
